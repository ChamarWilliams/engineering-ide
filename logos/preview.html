<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Loopline logo concepts</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,"Segoe UI",sans-serif;padding:2rem;background:#f5f5f5;color:#333}
h1{font-size:1.4rem;margin-bottom:1.5rem}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:1.5rem}
.card{border:1px solid #ddd;border-radius:12px;overflow:hidden;background:#fff}.card img{width:100%;display:block}
.label{padding:.7rem 1rem;font-size:.9rem;font-weight:500;border-top:1px solid #eee}.fav{display:flex;gap:1rem;align-items:end;padding:1rem}
.fav span{font-size:.7rem;opacity:.6}
</style></head><body><h1>Loopline logo concepts</h1><div class="grid">
<div class="card"><img src="concepts/concept-1.svg" alt="concept 1"><div class="fav"><img src="concepts/concept-1.svg" height="32" style="width:auto"><span>small</span></div><div class="label">1. Orbit: a loop track with a comet running round it</div></div>
<div class="card"><img src="concepts/concept-2.svg" alt="concept 2"><div class="fav"><img src="concepts/concept-2.svg" height="32" style="width:auto"><span>small</span></div><div class="label">2. Cells: two blocks, a call wire, and the return loop</div></div>
<div class="card"><img src="concepts/concept-3.svg" alt="concept 3"><div class="fav"><img src="concepts/concept-3.svg" height="32" style="width:auto"><span>small</span></div><div class="label">3. L-loop: the letter L ending in a loop</div></div>
<div class="card"><img src="concepts/concept-4.svg" alt="concept 4"><div class="fav"><img src="concepts/concept-4.svg" height="32" style="width:auto"><span>small</span></div><div class="label">4. Lemniscate: two nodes joined by a looping line</div></div>
<div class="card"><img src="concepts/concept-5.svg" alt="concept 5"><div class="fav"><img src="concepts/concept-5.svg" height="32" style="width:auto"><span>small</span></div><div class="label">5. Replay: play triangle inside a loop arrow</div></div>
</div></body></html>
